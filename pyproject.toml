[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-api-assistant"
version = "0.1.0"
description = "An MCP-based AI assistant that connects models to external APIs."
requires-python = ">=3.10"

dependencies = [
    "mcp[cli]>=2.2,<3",
    "httpx>=0.28,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
